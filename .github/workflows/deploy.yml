name: Deploy

# Runs after the CI workflow succeeds on main (workflow_run gives us the
# "needs ci success" gate across workflow files). Skips gracefully — instead
# of failing — when the FLY_API_TOKEN secret has not been configured yet.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: [self-hosted, prod-docker-01]
    timeout-minutes: 20
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      # Secrets are not available in `if:` at the job level, so probe in a
      # step and gate the remaining steps on its output.
      - name: Check for FLY_API_TOKEN
        id: fly-token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "FLY_API_TOKEN secret is not set - skipping deploy (see README.md deploy runbook)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        if: steps.fly-token.outputs.present == 'true'
        with:
          # Deploy the exact commit CI validated, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha }}

      # Pin third-party deploy code by commit: this step receives the production
      # Fly token, so a mutable branch/tag would be an avoidable supply-chain risk.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: steps.fly-token.outputs.present == 'true'

      - name: Deploy
        if: steps.fly-token.outputs.present == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      # Flush the Cloudflare edge cache after a successful deploy — insurance on
      # top of the origin no-cache headers. Skips gracefully (like the Fly token
      # above) when the secrets are absent. The token needs exactly one
      # permission: Zone > Cache Purge.
      - name: Purge Cloudflare cache
        if: steps.fly-token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "Cloudflare purge skipped (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID not set)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Purging Cloudflare edge cache for zone $CLOUDFLARE_ZONE_ID…"
          resp=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp"
          echo "$resp" | grep -q '"success":true' \
            || { echo "::error::Cloudflare purge failed"; exit 1; }
