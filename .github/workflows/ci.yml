name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck / lint / test / sim
    runs-on: [self-hosted, prod-docker-01]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm version is read from package.json#packageManager
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Simulation (500 seeded fuzz games)
        run: pnpm sim -- --games 500 --seed 42

  e2e:
    name: e2e (Playwright / chromium)
    # Kept on GitHub-hosted: the real-time gameplay suite is timing-sensitive and
    # times out under the load of the shared self-hosted box (ci + deploy run
    # self-hosted; e2e stays here where it's fast and reliable).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: ci
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm --filter @hp/client build

      - name: Build server bundle
        run: pnpm build:server

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
        env:
          # The webServer command reuses the builds from the steps above.
          E2E_SKIP_BUILD: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
