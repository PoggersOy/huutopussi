name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck / lint / test / sim
    # Was GitHub-hosted because the self-hosted runner's bundled npm breaks
    # pnpm/action-setup ("self-installer exits with code 1"). That is still true
    # on the bare host — but hosted runners have not started at all since
    # 2026-07-30 (billed minutes on a private repo; the job gets no runner and
    # runs 0 steps), and Deploy gates on this workflow succeeding, so main has
    # not reached Fly.io since 07-18.
    #
    # Running in a job container fixes both: inside node:24 the only npm on PATH
    # is the image's, so the self-installer works, and the job gets a throwaway
    # filesystem instead of the production host's.
    runs-on: [self-hosted, Linux, X64, poggersoy-shared]
    container: node:24
    # Self-hosted runners are the production box. This workflow also triggers on
    # pull_request, and without this a fork PR would execute repo code there.
    # Same-repo PRs are fine — pushing a branch already needs write access.
    if: >-
      github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # pnpm version is read from package.json#packageManager
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Simulation (500 seeded fuzz games)
        run: pnpm sim -- --games 500 --seed 42

      # The container runs as root; the runner and every later job on this box are
      # uid 1001. Without handing ownership back, actions/checkout in the next job
      # cannot clean the workspace and the run dies with EACCES before it starts.
      - name: Return the workspace to the runner user
        if: always()
        run: |
          # /__w is the runner's whole _work tree as mounted into the container.
          # Chowning only $GITHUB_WORKSPACE left pnpm's content-addressable store
          # (_work/.pnpm-store, ~1000 root-owned paths per run) behind, which a
          # later non-container job running as uid 1001 could not write to.
          chown -R 1001:1001 /__w 2>/dev/null || true
          chown -R 1001:1001 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" 2>/dev/null || true

  e2e:
    name: e2e (Playwright / chromium)
    # Kept on GitHub-hosted: the real-time gameplay suite is timing-sensitive and
    # times out under the load of the shared PoggersOy runner (ci + deploy run
    # there; e2e stays here where it's fast and reliable).
    #
    # While hosted runners cannot start, this is a SKIP rather than a red run —
    # a permanently red CI is one nobody reads, and Deploy gates on this
    # workflow's conclusion, which a skipped job does not spoil. Set
    # HOSTED_RUNNERS_AVAILABLE=true in repo variables when billing is back and
    # the gate returns with no code change.
    runs-on: ubuntu-latest
    if: vars.HOSTED_RUNNERS_AVAILABLE == 'true'
    timeout-minutes: 40
    needs: ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm --filter @hp/client build

      - name: Build server bundle
        run: pnpm build:server

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
        env:
          # The webServer command reuses the builds from the steps above.
          E2E_SKIP_BUILD: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
