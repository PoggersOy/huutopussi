name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck / lint / test / sim
    # GitHub-hosted: the self-hosted runner's bundled npm breaks pnpm/action-setup
    # ("self-installer exits with code 1"). e2e already runs here; keep both hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # pnpm version is read from package.json#packageManager
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Simulation (500 seeded fuzz games)
        run: pnpm sim -- --games 500 --seed 42

  e2e:
    name: e2e (Playwright / chromium)
    # Kept on GitHub-hosted: the real-time gameplay suite is timing-sensitive and
    # times out under the load of the shared self-hosted box (ci + deploy run
    # self-hosted; e2e stays here where it's fast and reliable).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm --filter @hp/client build

      - name: Build server bundle
        run: pnpm build:server

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
        env:
          # The webServer command reuses the builds from the steps above.
          E2E_SKIP_BUILD: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
